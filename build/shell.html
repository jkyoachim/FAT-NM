<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a clerk's search counter. Sticky filter bar over a dense ledger table; catalogue is a parcel register with expandable source cards. */
:root{
  --bg:#f6f5f1; --panel:#ffffff; --fg:#1d2228; --muted:#5d6670; --line:#dcd9d0; --accent:#8a4b16; --accent-soft:#f3e6d8;
  --ok:#2f6b3a; --ok-bg:#e3f0e4; --warn:#8a6100; --warn-bg:#f8eccc; --bad:#9b2c2c; --bad-bg:#f6dede; --link:#1f5a8a;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif; --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16191d; --panel:#1e2227; --fg:#e7e4dc; --muted:#9aa2ab; --line:#333a42; --accent:#e0a36b; --accent-soft:#3a2b1d;
  --ok:#8fd39b; --ok-bg:#1f3324; --warn:#e8c46a; --warn-bg:#3a3018; --bad:#f09a9a; --bad-bg:#3d2224; --link:#8cc2ee; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16191d; --panel:#1e2227; --fg:#e7e4dc; --muted:#9aa2ab; --line:#333a42; --accent:#e0a36b; --accent-soft:#3a2b1d;
  --ok:#8fd39b; --ok-bg:#1f3324; --warn:#e8c46a; --warn-bg:#3a3018; --bad:#f09a9a; --bad-bg:#3d2224; --link:#8cc2ee; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1400px;margin:0 auto}
header{background:var(--panel);border-bottom:1px solid var(--line)}
header .wrap{padding-block:18px 0;display:grid;gap:10px}
h1{font-family:var(--f-display);font-weight:600;font-size:26px;letter-spacing:.01em;margin:0;text-wrap:balance}
.sub{color:var(--muted);max-width:75ch;margin:0}
.flag{display:inline-block;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:var(--bad-bg);color:var(--bad);padding:2px 7px;border-radius:3px;margin-right:6px}
.stats{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:13px;color:var(--muted)}
.stats b{color:var(--fg);font-variant-numeric:tabular-nums;font-weight:600}
nav{display:flex;gap:4px;margin-top:6px}
nav a{padding:9px 14px;color:var(--muted);text-decoration:none;font-weight:500;border-bottom:3px solid transparent}
nav a[aria-current="page"]{color:var(--fg);border-color:var(--accent)}
nav a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .wrap{padding-block:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=search],select{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:7px 9px;min-width:0}
input[type=search]{flex:1 1 260px}
select{flex:0 1 auto;max-width:220px}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;margin-left:auto}
main .wrap{padding-block:14px 40px}
.tbl{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:4px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--panel);text-align:left;font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.mono{font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.bp{font-family:var(--f-mono);font-weight:500;white-space:nowrap}
.cat{display:inline-block;font-size:11px;padding:1px 6px;border-radius:3px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.note{color:var(--warn);font-size:12px}
.src a{color:var(--link);font-size:12px;text-decoration:none}
.src a:hover{text-decoration:underline}
.more{margin:14px 0;display:flex;justify-content:center}
button{font:inherit;cursor:pointer;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:7px 14px}
button:hover{border-color:var(--accent)}
.chip{display:inline-block;font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:10px;white-space:nowrap}
.c-ok{background:var(--ok-bg);color:var(--ok)} .c-warn{background:var(--warn-bg);color:var(--warn)} .c-bad{background:var(--bad-bg);color:var(--bad)}
.reg{display:grid;gap:6px}
details.p{background:var(--panel);border:1px solid var(--line);border-radius:4px}
details.p>summary{list-style:none;cursor:pointer;padding:10px 12px;display:grid;grid-template-columns:minmax(0,110px) minmax(0,150px) minmax(0,1fr) auto;gap:4px 14px;align-items:center}
details.p>summary::-webkit-details-marker{display:none}
details.p[open]>summary{border-bottom:1px solid var(--line)}
.own{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.own small{color:var(--muted);margin-left:6px}
.body{padding:10px 12px 14px;display:grid;gap:10px}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.files{display:grid;gap:4px}
.file{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-size:13px}
.file .k{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;min-width:68px}
.file a{color:var(--link)}
.empty{padding:30px;text-align:center;color:var(--muted)}
@media (max-width:640px){details.p>summary{grid-template-columns:minmax(0,1fr) auto}.own{grid-column:1/-1}h1{font-size:22px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
<header><div class="wrap">
  <h1>__TITLE__</h1>
  <p class="sub"><span class="flag">Not examined</span>__SUB__</p>
  <div class="stats" id="stats"></div>
  <nav aria-label="Views"><a href="#pull" id="t-pull">Pull list</a><a href="#catalogue" id="t-cat">Document catalogue</a></nav>
</div></header>
<section id="v-pull">
  <div class="bar"><div class="wrap">
    <input type="search" id="q" placeholder="Search name, book/page (e.g. 461/633), APN, doc type…" aria-label="Search the pull list">
    <select id="fc" aria-label="County"><option value="">All counties</option></select>
    <select id="ff" aria-label="FA file"><option value="">All FA files</option></select>
    <select id="fk" aria-label="Category"><option value="">All categories</option></select>
    <span class="count" id="cnt"></span>
  </div></div>
  <main><div class="wrap">
    <div class="tbl"><table><thead><tr><th>FA file</th><th>APN / Account</th><th>Section</th><th>#</th><th>Category</th><th>Type</th><th>Book/Page</th><th>Dated</th><th>Recorded</th><th>Grantor</th><th>Grantee</th><th>Qtr</th><th>Source</th></tr></thead><tbody id="rows"></tbody></table></div>
    <div class="more"><button id="more" type="button">Show 300 more</button></div>
  </div></main>
</section>
<section id="v-cat" hidden>
  <div class="bar"><div class="wrap">
    <input type="search" id="cq" placeholder="Search APN, owner, section, file name…" aria-label="Search the catalogue">
    <select id="cc" aria-label="County"><option value="">All counties</option></select>
    <select id="cs" aria-label="Coverage"><option value="">All coverage</option></select>
    <span class="count" id="ccnt"></span>
  </div></div>
  <main><div class="wrap"><div class="reg" id="reg"></div></div></main>
</section>

<script id="data" type="application/json">__DATA__</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const P=D.P,S=D.S,R=D.R,CATS=D.cats,NOTES=D.notes,DOCS=D.docs||{},MODE='__MODE__';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>n.toLocaleString('en-US');
const chipCls=s=>s.startsWith('NO SOURCE')?'c-bad':(s.startsWith('Index + abstract')||s.startsWith('Ground'))?'c-ok':'c-warn';
// stats
const seeded=P.filter(p=>p[8].startsWith('Seeded')).length, nosrc=P.filter(p=>p[6].startsWith('NO SOURCE')).length;
$('stats').innerHTML=MODE==='cat'?(()=>{const n={};Object.values(DOCS).flat().forEach(d=>n[d[0]]=(n[d[0]]||0)+1);return `<span><b>${fmt(P.length)}</b> parcels</span>`+Object.entries(n).map(([k,v])=>`<span><b>${fmt(v)}</b> ${esc(k.toLowerCase())}s</span>`).join('')+`<span><b>${fmt(S.length)}</b> index/abstract files</span>`})():`<span><b>${fmt(P.length)}</b> parcels</span><span><b>${fmt(R.length)}</b> instruments to pull</span><span><b>${fmt(S.length)}</b> index/abstract files</span><span><b>${seeded}</b> draft runsheets seeded</span><span><b>${nosrc}</b> parcels with no source yet</span>`;
// search index
const idx=R.map(r=>{const p=P[r[0]];return [p[1],p[2],p[3],p[4],r[3],r[4]+'/'+r[5],r[4]+'-'+r[5],r[8],r[9],r[6],r[7],CATS[r[2]]].join(' ').toLowerCase()});
const opt=(sel,vals)=>{for(const v of vals){const o=document.createElement('option');o.value=v;o.textContent=v;sel.appendChild(o)}};
opt($('fc'),[...new Set(P.map(p=>p[0]))]); opt($('ff'),[...new Set(P.map(p=>p[1]))].sort()); opt($('fk'),CATS);
let hits=[],shown=0;
function run(){
  const q=$('q').value.trim().toLowerCase().split(/\s+/).filter(Boolean), c=$('fc').value,f=$('ff').value,k=$('fk').value;
  hits=[];for(let i=0;i<R.length;i++){const r=R[i],p=P[r[0]];if(c&&p[0]!==c)continue;if(f&&p[1]!==f)continue;if(k&&CATS[r[2]]!==k)continue;if(q.length&&!q.every(t=>idx[i].includes(t)))continue;hits.push(i)}
  shown=0;$('rows').innerHTML='';page();
}
function page(){
  const out=[];const end=Math.min(hits.length,shown+300);
  for(let j=shown;j<end;j++){const r=R[hits[j]],p=P[r[0]];
    const src=r[11].map(si=>{const s=S[si];const u=s[8]||s[9];return `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(s[5])}</a>`}).join('<br>');
    const note=NOTES[r[12]]?`<div class="note">${esc(NOTES[r[12]])}</div>`:'';
    out.push(`<tr><td class="mono">${esc(p[1])}</td><td class="mono">${esc(p[2])}</td><td class="mono">${esc(p[4].split(' ')[0])}</td><td class="mono">${r[1]}</td><td><span class="cat">${esc(CATS[r[2]])}</span></td><td class="mono">${esc(r[3])}</td><td class="bp">${esc(r[4])}/${esc(r[5])}</td><td class="mono">${esc(r[6])}</td><td class="mono">${esc(r[7])}</td><td>${esc(r[8])}</td><td>${esc(r[9])}${note}</td><td class="mono">${esc(r[10])}</td><td class="src">${src}</td></tr>`)}
  $('rows').insertAdjacentHTML('beforeend',out.join(''));shown=end;
  $('cnt').textContent=hits.length?`Showing ${fmt(shown)} of ${fmt(hits.length)}`:'No matching instruments';
  $('more').parentElement.hidden=shown>=hits.length;
}
$('more').onclick=page;
let tm;for(const id of ['q','fc','ff','fk'])$(id).addEventListener('input',()=>{clearTimeout(tm);tm=setTimeout(run,120)});
// catalogue
const byApn={};S.forEach((s,i)=>{for(const a of String(s[7]).split(', '))(byApn[a.split(' ')[0]] ||= []).push(i)});
opt($('cc'),[...new Set(P.map(p=>p[0]))]); opt($('cs'),[...new Set(P.map(p=>p[6]))].sort());
const pullN={};R.forEach(r=>pullN[r[0]]=(pullN[r[0]]||0)+1);
function cat(){
  const q=$('cq').value.trim().toLowerCase().split(/\s+/).filter(Boolean),c=$('cc').value,s=$('cs').value;
  const out=[];let n=0;
  P.forEach((p,i)=>{if(c&&p[0]!==c)return;if(s&&p[6]!==s)return;const fl=(byApn[p[2]]||[]);
    const dl=DOCS[p[2]]||[];const hay=(p.slice(0,6).join(' ')+' '+fl.map(x=>S[x][5]).join(' ')+' '+dl.map(d=>d[0]+' '+d[1]).join(' ')).toLowerCase();if(q.length&&!q.every(t=>hay.includes(t)))return;n++;
    const dfiles=dl.map(d=>`<div class="file"><span class="k">${esc(d[0])}</span><a href="${esc(d[2])}" target="_blank" rel="noopener">${esc(d[1])}</a></div>`).join('');const files=fl.map(x=>{const f=S[x];return `<div class="file"><span class="k">${esc(f[1])}</span><span>${esc(f[5])}</span><span class="mono">${esc(f[3])} ${esc(f[4])}</span>${f[8]?`<a href="${esc(f[8])}" target="_blank" rel="noopener">Open copy</a>`:''}<a href="${esc(f[9])}" target="_blank" rel="noopener">Original</a></div>`}).join('')||'<div class="note">No index or abstract found for this parcel yet.</div>';
    out.push(`<details class="p"><summary><span class="mono">${esc(p[1])}</span><span class="mono">${esc(p[2])}</span><span class="own">${esc(p[3])}<small>${esc(p[4])} ${esc(p[5])}</small></span><span class="chip ${chipCls(p[6])}">${esc(p[6])}</span></summary><div class="body"><dl class="kv"><dt>Legal</dt><dd>${esc(p[10])}</dd><dt>Draft runsheet</dt><dd>${esc(p[8])}</dd>${MODE==='cat'?'':`<dt>Pull items</dt><dd>${fmt(pullN[i]||0)}</dd>`}<dt>Folder</dt><dd><a href="${esc(p[9])}" target="_blank" rel="noopener" style="color:var(--link)">Open parcel folder</a></dd></dl><div class="files">${dfiles}${files}</div></div></details>`)});
  $('reg').innerHTML=out.join('')||'<div class="empty">No parcels match.</div>';$('ccnt').textContent=`${fmt(n)} parcels`;
}
let tc;for(const id of ['cq','cc','cs'])$(id).addEventListener('input',()=>{clearTimeout(tc);tc=setTimeout(cat,120)});
let catDone=false;
function route(){const v=MODE;$('v-pull').hidden=v!=='pull';$('v-cat').hidden=v!=='cat';
  $('t-pull').setAttribute('aria-current',v==='pull'?'page':'false');$('t-cat').setAttribute('aria-current',v==='cat'?'page':'false');
  if(v==='cat'&&!catDone){cat();catDone=true}}
if(MODE==='cat'){$('t-pull').hidden=true;$('t-cat').href='#';}else{$('t-cat').hidden=true;$('t-pull').href='#';}
run();route();
</script>
